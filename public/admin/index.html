<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Private admin: not linked from the site and kept out of search engines.
         Saving requires signing in with a GitHub account that has write access to the repo. -->
    <meta name="robots" content="noindex, nofollow" />
    <title>Unnati Ladder · Admin</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <!-- This page holds a token that can write to the repo, so the CMS script is pinned to an exact
         version and hash: if the CDN ever served different code, the browser would refuse to run it.
         When upgrading, update the version and recompute the hash, e.g.
         curl -sL <url> | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script
      src="https://unpkg.com/@sveltia/cms@0.227.3/dist/sveltia-cms.js"
      integrity="sha384-8hMzaf/90SQ5tmWKilMTR2nNU+HEw84lYds8R0eo32rjS6u1h98IrxiM3Jde+XLN"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
