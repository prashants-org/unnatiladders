<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unnati Ladder | Franchise &amp; Business Consultancy, Pune</title>
    <!-- Lets CSS tell "JavaScript is running" apart from the plain pre-rendered page -->
    <script>document.documentElement.classList.add("js")</script>
    <meta
      name="description"
      content="Own a proven brand without the guesswork. Unnati Ladder matches entrepreneurs with franchise brands and handles planning, paperwork and launch. Pune, India."
    />
    <!-- Title, description, og:* and canonical are rewritten per route by scripts/prerender.mjs -->
    <link rel="canonical" href="https://unnatiladder.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Unnati Ladder" />
    <meta property="og:url" content="https://unnatiladder.com/" />
    <meta property="og:title" content="Unnati Ladder | Growing Together" />
    <meta property="og:description" content="Franchise and business consultancy based in Pune, India." />
    <!-- Social apps need an absolute PNG/JPG; they don't render SVG -->
    <meta property="og:image" content="https://unnatiladder.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Unnati Ladder – Growing Together. Franchise & business consultancy, Pune." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Business details (JSON-LD) are added at build time from profile/content.json -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
