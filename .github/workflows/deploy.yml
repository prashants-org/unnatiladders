name: Deploy site

# Runs on every push to main, including saves made in the /admin editor, and deploys.
# On pull requests it runs the same checks and build, without deploying.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One run per branch/PR; a newer push cancels the older run
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          npm ci
          pip install qrcode==8.2

      # Fails on invalid brands or profile content (e.g. a bad /admin save) before anything is built
      - name: Check content
        run: npm run check

      # Regenerates public/Unnati-Ladder-Profile.pdf from profile/*.json (uses the runner's Google Chrome)
      - name: Build company profile PDF
        run: python profile/build.py

      # Client build + server build, then pre-renders every page to static HTML (scripts/prerender.mjs)
      # --ignore-scripts skips the prebuild content check, which already ran above
      - name: Build site
        run: npm run build --ignore-scripts
        env:
          VITE_WEB3FORMS_KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}

      # Change to `exit 1` once the form is live, so a deploy can never ship a dead form
      - name: Check enquiry form key
        if: github.event_name != 'pull_request'
        env:
          KEY: ${{ secrets.VITE_WEB3FORMS_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::warning::VITE_WEB3FORMS_KEY secret is not set, so the contact form can't send enquiries."
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
